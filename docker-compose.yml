# Optional local Postgres for fast tests / offline dev (the app normally uses Neon).
#   docker compose up -d db
#   TEST_DATABASE_URL=postgresql://agent:agent@localhost:5433/agent pytest
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 2s
      retries: 15
